[package]
name = "dwin-studio"
version = "1.0.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
eframe = "0.37.0"
epaint_default_fonts = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
jpeg-encoder = "0.7.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4", default-features = false }
tiny-skia = "0.12.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
