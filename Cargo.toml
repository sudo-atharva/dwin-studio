[package]
name = "uwin-studio"
version = "1.2.2"
edition = "2024"
description = "Visual screen editor and simulator for DWIN T5L (DGUS II) displays"
license = "MIT"
authors = ["sudo-atharva"]
repository = "https://github.com/sudo-atharva/uwin-studio"

[dependencies]
ab_glyph = "0.2.32"
eframe = "0.37.0"
epaint_default_fonts = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
jpeg-encoder = "0.7.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4", default-features = false }
tiny-skia = "0.12.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
